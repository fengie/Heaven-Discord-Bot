# Deploy on the authorized Heaven1 Docker host after provisioning credentials.
# No ports, privileged intents, or host filesystem mounts are required.
services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
