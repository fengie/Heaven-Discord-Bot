name: Discord Bot Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit and inherited bootstrap tests
        run: npm test
      - name: Check source syntax
        run: npm run check
      - name: Check H1 installer syntax and fail-closed non-WSL guard
        shell: bash
        run: |
          bash -n scripts/bootstrap-heaven1.sh
          set +e
          output="$(bash scripts/bootstrap-heaven1.sh 2>&1)"
          status=$?
          set -e
          if [[ "$status" -eq 0 || "$output" != *HEAVEN1_WSL_REQUIRED* ]]; then
            echo "Installer guard failed to refuse a non-H1 Linux host"
            exit 1
          fi
      - name: Build H1 container definition (no credentials)
        run: docker build --tag heaven-discord-bot:ci .
