name: Discord Bot Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit and inherited bootstrap tests
        run: npm test
      - name: Verify explicit Toolbox release hold
        run: node scripts/report-release-readiness.mjs --assert-held
      - name: Check source syntax
        run: npm run check
      - name: Check H1 installer syntax and fail-closed non-WSL guard
        shell: bash
        run: |
          bash -n scripts/bootstrap-heaven1.sh
          set +e
          output="$(bash scripts/bootstrap-heaven1.sh 2>&1)"
          status=$?
          set -e
          if [[ "$status" -eq 0 || "$output" != *HEAVEN1_WSL_REQUIRED* ]]; then
            echo "Installer guard failed to refuse a non-H1 Linux host"
            exit 1
          fi
      - name: Build H1 container definition (no credentials)
        run: docker build --tag heaven-discord-bot:ci .
  powershell-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Windows PowerShell 5.1 parse and safe off-host refusal
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\Install-HeavenBot.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'WINDOWS_BOOTSTRAP_PARSE_FAILED' }
          $oldPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -File $scriptPath -Mode Install 2>&1
            $exitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $oldPreference
          }
          if ($exitCode -eq 0 -or ([string]($output -join ' ')) -notmatch 'HEAVEN1_REQUIRED') {
            throw 'WINDOWS_BOOTSTRAP_HOST_DENIAL_FAILED'
          }
          # The tested child exited 1 intentionally; do not propagate its code.
          exit 0
